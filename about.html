<!DOCTYPE html>

<html lang="en">

<head>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"

<body class="bg" onmousemove="moveHead(event)" onresize="resized()">
  <div class="zoomed">
    <div class="transition slide is-active" id="transELM" style="background-color:#F6D68D"></div>
    <header>
      <a href="index.html">
        <h1 id="sTitle"><img src="./everymanHead/LOGO.png" class="logo">mambo</h1>
      </a>

      <img src="./everymanHead/head1.png" id="head1" class="head" unselectable="on">
      <img src="./everymanHead/head2.png" id="head2" class="head" unselectable="on">
      <img src="./everymanHead/head3.png" id="head3" class="head" unselectable="on">
      <a href="index.html"> <img src="./everymanHead/head4.png" id="head4" class="head" style="visibility: visible"
          unselectable="on"> </a>
      <img src="./everymanHead/head5.png" id="head5" class="head" unselectable="on">
      <img src="./everymanHead/head6.png" id="head6" class="head" unselectable="on">
      <img src="./everymanHead/head7.png" id="head7" class="head" unselectable="on">

      <a href="./projects.html">
        <h1 id="projects" class="small3" style="left: 73%" onmouseenter="hovered('und1')"
          onmouseleave="unhovered('und1')" onclick="clicked(1)">projects<div id="und1" class="transition sHover"
            style="width:101%;background-color:#FE4773"></div>
        </h1>
      </a>
      <a href="./about.html">
        <h1 id="about" class="small3" style="left: 82%" onclick="clicked(2)">about<div id="und2"
            class="transition hover hovering" style="width:105%;background-color:#F6D68D"></div>
        </h1>
      </a>
      <a href="./contact.html">
        <h1 id="contact" class="small3" style="left: 90.5%" onmouseenter="hovered('und3')"
          onmouseleave="unhovered('und3')" onclick="clicked(3)">socials<div id="und3" class="transition sHover"
            style="width:101%;background-color:#46B3A5"></div>
        </h1>
      </a>

    </header>

    <h1 id="pageTitle" onmouseover="hovered('about2')" onmouseleave="unhovered('about2')"
      style="top:25%;user-select: none;">about me<div id="about2" class="transition sHover"
        style="width:105%;background-color:#F6D68D;">
      </div>
    </h1>
    </a>

    <p class="info">
      I'm a <span id="age"></span> year old high school student and I like making <a href="./projects.html" class="link"
        onclick="clicked(1)"> things</a>. 
    </p>

    <p class="info" style="top:57%;left:50%">

    <script type="text/javascript" src="./main.js"></script>
    <script src="https://unpkg.com/dayjs@1.8.21/dayjs.min.js"></script>
    <script>
      let ageEl = document.getElementById("age");
      setInterval(() => {
        let time = dayjs().diff(dayjs(1178841600000), 'year', true);
        ageEl.innerText = time.toString().substring(0, 12);
      }, 50);
    </script>
  </div>
